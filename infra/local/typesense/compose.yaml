volumes:
  typesense-data:
    driver: local

services:
  # Typesense search engine
  typesense:
    container_name: offgrid_typesense
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    networks:
      - default
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TN_TYPESENSE_API_KEY}
      - TYPESENSE_ENABLE_CORS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The Typesense Dashboard (UI)
  typesense-dashboard:
    image: ghcr.io/bfritscher/typesense-dashboard:latest
    container_name: offgrid_typesense_dashboard
    restart: unless-stopped
    depends_on:
      typesense:
        condition: service_healthy
    networks:
      - default
    ports:
      - "8109:80"
